<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Komit Escrow 운영</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172033;font-family:system-ui,sans-serif}header{background:#0f172a;color:white;padding:18px 28px;display:flex;align-items:center;justify-content:space-between}header h1{font-size:20px;margin:0}button{border:1px solid #475569;background:#1e293b;color:white;padding:8px 13px;border-radius:8px;cursor:pointer}main{max-width:1440px;margin:auto;padding:24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.card,.panel{background:white;border:1px solid #dbe3ee;border-radius:14px;padding:18px;box-shadow:0 2px 8px #0f172a0b}.label{font-size:13px;color:#64748b}.value{font-size:25px;font-weight:800;margin-top:8px}.danger{color:#dc2626}.good{color:#15803d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.panel{margin-top:16px}.grid .panel{margin-top:0}h2{font-size:17px;margin:0 0 14px}.account{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #e2e8f0}.account:last-child{border:0}.notice{background:#fff7ed;color:#9a3412;padding:12px;border-radius:9px;margin-top:12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #e2e8f0;white-space:nowrap}th{color:#64748b;background:#f8fafc}.scroll{overflow:auto}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#e2e8f0;font-size:12px}.held{background:#fee2e2;color:#991b1b}@media(max-width:800px){.grid{grid-template-columns:1fr}main{padding:14px}}
  </style>
</head>
<body>
<header><h1>Komit Escrow 운영 현황</h1><form th:action="${adminPrefix + '/admin/logout'}" method="post"><button>로그아웃</button></form></header>
<main>
  <section class="cards">
    <div class="card"><div class="label">전체 에스크로</div><div class="value" th:text="${dashboard.overview.total}">0</div></div>
    <div class="card"><div class="label">활성 계약</div><div class="value good" th:text="${dashboard.overview.active}">0</div></div>
    <div class="card"><div class="label">동결 계약</div><div class="value danger" th:text="${dashboard.overview.held}">0</div></div>
    <div class="card"><div class="label">종료 계약</div><div class="value" th:text="${dashboard.overview.closed}">0</div></div>
    <div class="card"><div class="label">미확정 거래</div><div class="value danger" th:text="${dashboard.overview.unresolved}">0</div></div>
    <div class="card"><div class="label">회원계좌 발급 완료</div><div class="value" th:text="${dashboard.overview.accountsCompleted}">0</div></div>
  </section>
  <section class="grid">
    <div class="panel"><h2>자금 원장</h2>
      <div class="account"><span>완료 예치액</span><b th:text="${#numbers.formatInteger(dashboard.money.deposited,1,'COMMA')} + '원'">0원</b></div>
      <div class="account"><span>완료 지급액</span><b th:text="${#numbers.formatInteger(dashboard.money.released,1,'COMMA')} + '원'">0원</b></div>
      <div class="account"><span>완료 수수료</span><b th:text="${#numbers.formatInteger(dashboard.money.fees,1,'COMMA')} + '원'">0원</b></div>
      <div class="account"><span>완료 환불액</span><b th:text="${#numbers.formatInteger(dashboard.money.refunded,1,'COMMA')} + '원'">0원</b></div>
      <div class="account"><span>원장 잔액</span><b th:text="${#numbers.formatInteger(dashboard.money.ledgerBalance(),1,'COMMA')} + '원'">0원</b></div>
    </div>
    <div class="panel"><h2>금융망 계좌</h2>
      <div class="account"><span th:text="'보관계좌 ' + ${dashboard.escrowAccount}">보관계좌</span><b th:text="${dashboard.escrowBankBalance == null ? '-' : #numbers.formatInteger(dashboard.escrowBankBalance,1,'COMMA') + '원'}">-</b></div>
      <div class="account"><span th:text="'수수료계좌 ' + ${dashboard.feeAccount}">수수료계좌</span><b th:text="${dashboard.feeBankBalance == null ? '-' : #numbers.formatInteger(dashboard.feeBankBalance,1,'COMMA') + '원'}">-</b></div>
      <div class="notice" th:if="${dashboard.financeError}" th:text="${dashboard.financeError}"></div>
      <div class="account" th:if="${dashboard.reconciliation != null}"><span>최근 대사</span><b th:classappend="${dashboard.reconciliation.result == 'MATCHED'} ? 'good' : 'danger'" th:text="${dashboard.reconciliation.result}">MATCHED</b></div>
    </div>
  </section>
  <section class="panel"><h2>최근 에스크로 최대 100건</h2><div class="scroll"><table><thead><tr><th>ID</th><th>서비스</th><th>계약 ID</th><th>유형</th><th>상태</th><th>동결</th><th>예정 금액</th><th>잔액</th><th>생성일</th></tr></thead><tbody>
    <tr th:each="row : ${dashboard.escrows}"><td th:text="${row.id}"></td><td th:text="${row.serviceName}"></td><td th:text="${row.contractId}"></td><td th:text="${row.contractType}"></td><td><span class="badge" th:text="${row.status}"></span></td><td><span class="badge" th:classappend="${row.holdStatus == 'HELD'} ? ' held'" th:text="${row.holdStatus}"></span></td><td th:text="${#numbers.formatInteger(row.expectedAmount,1,'COMMA')}"></td><td th:text="${#numbers.formatInteger(row.balance,1,'COMMA')}"></td><td th:text="${row.createdAt}"></td></tr>
  </tbody></table></div></section>
  <section class="panel"><h2>서비스 클라이언트</h2><div class="scroll"><table><thead><tr><th>서비스</th><th>상태</th><th>1원 인증 문구</th><th>등록일</th><th>수정일</th></tr></thead><tbody>
    <tr th:each="client : ${dashboard.clients}"><td th:text="${client.name}"></td><td th:text="${client.status}"></td><td th:text="${client.authMessage ?: '-'}"></td><td th:text="${client.createdAt}"></td><td th:text="${client.updatedAt}"></td></tr>
  </tbody></table></div></section>
</main></body></html>

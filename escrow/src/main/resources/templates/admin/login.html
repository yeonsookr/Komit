<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Komit Escrow 운영 로그인</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e5e7eb;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(420px,calc(100% - 32px));background:#111827;border:1px solid #273449;border-radius:18px;padding:32px;box-shadow:0 24px 70px #0008}h1{margin:0 0 8px;font-size:24px}.sub{color:#94a3b8;margin:0 0 28px}label{display:block;margin:16px 0 7px;font-size:14px;color:#cbd5e1}input{width:100%;padding:13px;border-radius:9px;border:1px solid #334155;background:#0f172a;color:white}button{width:100%;margin-top:24px;padding:13px;border:0;border-radius:9px;background:#38bdf8;color:#082f49;font-weight:800;cursor:pointer}.alert{padding:11px;border-radius:8px;margin:12px 0;font-size:14px}.error{background:#451a1a;color:#fecaca}.ok{background:#052e16;color:#bbf7d0}
  </style>
</head>
<body><main class="box">
  <h1>Escrow Operations</h1><p class="sub">인가된 운영자만 접근할 수 있습니다.</p>
  <div class="alert error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</div>
  <div class="alert ok" th:if="${param.logout}">안전하게 로그아웃되었습니다.</div>
  <form th:action="${adminPrefix + '/admin/login'}" method="post">
    <label for="username">운영자 아이디</label><input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">로그인</button>
  </form>
</main></body></html>

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/escrow}
    username: ${DB_USERNAME:escrow}
    password: ${DB_PASSWORD:escrow}

app:
  instance-role: ${APP_INSTANCE_ROLE:WRITER}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8081}
  security:
    # 로컬 전용 예시값. 운영에서는 반드시 Secret으로 교체합니다.
    client-api-key-hmac-secret: ${CLIENT_API_KEY_HMAC_SECRET:dev-only-client-api-key-hmac-secret}
    sensitive-data-hmac-secret: ${SENSITIVE_DATA_HMAC_SECRET:dev-only-sensitive-data-hmac-secret}
    encryption-key-base64: ${FIELD_ENCRYPTION_KEY_BASE64:ZGV2LW9ubHktMzItYnl0ZS1hZXMta2V5LTAwMDAwMDA=}
    encryption-key-version: ${FIELD_ENCRYPTION_KEY_VERSION:1}
    operator-api-key: ${OPERATOR_CLIENT_API_KEY:dev-only-operator-client-api-key}
  finance:
    enabled: ${SSAFY_FINANCE_ENABLED:false}
    base-url: ${SSAFY_FINANCE_BASE_URL:https://finopenapi.ssafy.io/ssafy}
    api-key: ${SSAFY_FINANCE_API_KEY:disabled-local-api-key}
    time-zone: ${SSAFY_FINANCE_TIME_ZONE:Asia/Seoul}
    account-type-unique-no: ${SSAFY_DEMAND_DEPOSIT_PRODUCT_NO:001-1-231ecb61d2554c}
    escrow-user-key: ${SSAFY_ESCROW_USER_KEY:disabled-local-escrow-user-key}
    escrow-account-no: ${SSAFY_ESCROW_ACCOUNT_NO:0010000000000000}
    fee-account-no: ${SSAFY_FEE_ACCOUNT_NO:0010000000000001}
    virtual-account-validity-days: ${SSAFY_VIRTUAL_ACCOUNT_VALIDITY_DAYS:30}

logging:
  level:
    com.a501: DEBUG

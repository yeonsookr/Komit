# Bean Validation 문구. 목 서버(mock/app/routers/service.py의 _reason)와 글자까지 같아야 합니다.
# Boot가 이 MessageSource를 Hibernate Validator의 메시지 보간에 연결하므로 표준 키를 덮어쓰면 됩니다.
# 보낸 값은 절대 문구에 넣지 않습니다. {value}·{min}·{max}는 서버가 정한 한계값입니다.
jakarta.validation.constraints.NotNull.message=필수 항목입니다.
jakarta.validation.constraints.NotBlank.message=필수 항목입니다.
jakarta.validation.constraints.NotEmpty.message=필수 항목입니다.
jakarta.validation.constraints.Min.message={value} 이상이어야 합니다.
jakarta.validation.constraints.Max.message={value} 이하여야 합니다.
jakarta.validation.constraints.DecimalMin.message={value} 이상이어야 합니다.
jakarta.validation.constraints.DecimalMax.message={value} 이하여야 합니다.
jakarta.validation.constraints.Positive.message=0 이상이어야 합니다.
jakarta.validation.constraints.PositiveOrZero.message=0 이상이어야 합니다.
jakarta.validation.constraints.Negative.message=0 이하여야 합니다.
jakarta.validation.constraints.NegativeOrZero.message=0 이하여야 합니다.
jakarta.validation.constraints.Pattern.message=형식이 올바르지 않습니다.
jakarta.validation.constraints.Email.message=형식이 올바르지 않습니다.
# @Size 기본은 문자열 최대 길이(목의 max_length)입니다. 다른 뜻으로 쓸 때는 아래 키를 message에 적습니다.
#   @Size(min = 1, message = "{komit.minLength}")      문자열 최소 길이
#   @Size(min = 1, message = "{komit.minItems}")       목록 최소 개수
#   @Size(max = 10, message = "{komit.maxItems}")      목록 최대 개수
jakarta.validation.constraints.Size.message={max}자 이하여야 합니다.
komit.minLength={min}자 이상이어야 합니다.
komit.minItems={min}개 이상이어야 합니다.
komit.maxItems={max}개 이하여야 합니다.

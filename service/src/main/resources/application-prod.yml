spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      # Sentinel에 현재 Primary 주소를 물어 접속합니다. failover 후에도 Lettuce가 새 Primary로 다시 붙습니다.
      sentinel:
        master: ${REDIS_SENTINEL_MASTER}
        nodes: ${REDIS_SENTINEL_NODES}
        password: ${REDIS_PASSWORD}
      password: ${REDIS_PASSWORD}

app:
  datasource:
    read-url: ${DB_READ_URL}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

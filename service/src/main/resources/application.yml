spring:
  application:
    name: service
  profiles:
    default: local
  sql:
    init:
      # 상태코드 시드(data.sql)만 실행합니다. 스키마는 JPA가 맡습니다.
      mode: always
      encoding: UTF-8
  task:
    execution:
      shutdown:
        # 내려갈 때 뒤에서 돌던 세션 요약을 끝내고 내려간다. 요약은 다시 만드는 장치가 없어
        # 끊기면 비어 남는다. AI 쪽 요약 한도(app.ai.summary-read-timeout 150s)만큼 기다린다.
        await-termination: true
        await-termination-period: 150s
  jpa:
    open-in-view: false
    # 시드를 JPA 스키마 생성 뒤에 실행합니다.
    defer-datasource-initialization: true
    hibernate:
      # 스키마는 JPA 엔티티 매핑으로 만듭니다. Flyway는 쓰지 않습니다.
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  # WRITER | READER. 배포 환경 값으로만 주입하며 프로필과 섞지 않습니다.
  instance-role: ${APP_INSTANCE_ROLE}
  # 이 서버가 밖에서 보이는 주소. nginx 뒤에서는 경로 접두사까지 포함합니다. (예: https://komit.site/service)
  public-base-url: ${APP_PUBLIC_BASE_URL}
  auth:
    access-token-ttl: 15m
    refresh-token-ttl: 14d
  storage:
    # R-FILE-01, R-FILE-03. MinIO 프리사인 URL 자체의 상한은 7일입니다.
    bucket: ${STORAGE_BUCKET:komit}
    region: ${STORAGE_REGION:us-east-1}
    # R-FILE-01: 가장 큰 파일인 세션 녹음에 맞춥니다. 24kbps 고정에 90분이면 14MiB 안팎입니다.
    max-file-bytes: 31457280
    upload-url-ttl: 5m
    read-url-ttl: 15m
  withdrawal:
    # R-ACC-06: 보관 기간이 지난 탈퇴 회원의 식별 정보를 지우는 작업. 매일 새벽 4시(한국 시각)에 돕니다.
    # 모든 파드에서 돌아도 한 사람은 한 번만 지워집니다. 재가입 판정은 로그인 때 따로 하므로 이 주기와 상관없습니다.
    anonymize-cron: "0 0 4 * * *"
  logging:
    # 이 시간을 넘긴 컨트롤러·서비스 호출은 WARN으로 남깁니다. (common/logging/LoggingAspect)
    # @SlowCallThreshold 가 붙은 호출은 그 값을 쓰므로 여기에 걸리지 않습니다.
    slow-call-threshold: 1s
  turn:
    # 통화가 붙는 첫 단계. 비워 두면 브라우저가 상대와 직접 꽂을 방법을 못 찾습니다.
    stun-urls: ${TURN_STUN_URLS:}
    # 중계 주소. 비워 두면 중계 없이 직접 연결만 씁니다 — 중계 서버가 없는 환경에서도
    # 통화는 되어야 하므로 기동을 막지 않습니다.
    turn-urls: ${TURN_URLS:}
    # 우리 서버와 중계 서버만 아는 값. 이것이 나가면 누구나 우리 중계기를 씁니다.
    shared-secret: ${TURN_SHARED_SECRET:}
    # R-CON-19: 발급한 자격은 취소할 수 없어 수명이 곧 악용 가능한 시간입니다. 그래도
    # 한 통화보다는 길게 둡니다 — 통화 도중에 죽으면 중계를 다시 얻을 길이 없습니다.
    credential-ttl: 2h
  settlement:
    # 컨설팅 자동 지급(R-CON-10)과 개발 계약 전액 지급(R-PAY-01)을 몇 분마다 볼지.
    # 이의 제기 기간과 지급 소요(R-PAY-02)가 일 단위라 몇 분 늦어도 됩니다.
    payout-initial-delay: 1m
    payout-interval: 5m
    # 한 계약의 지급을 한 서버만 하게 잡는 잠금의 수명. Escrow 호출 세 번(목록·상세·지급)의
    # 읽기 한도 합보다 길어야, 잡은 서버가 일하는 도중에 다른 서버가 끼어들지 않습니다.
    payout-lock-ttl: 3m
  contract:
    # 작업 자동 통과(R-QA-02)를 몇 분마다 볼지. 기한이 일 단위라 몇 분 늦어도 됩니다.
    auto-pass-initial-delay: 1m
    auto-pass-interval: 5m
  transcriber:
    # 전사를 받아 가는 노트북의 토큰. 비워 두면 전사 경로가 모두 401 로 닫힙니다.
    token: ${TRANSCRIBER_TOKEN:}
  realtime:
    # R-RT-01: 티켓을 받아 WebSocket 을 여는 사이에만 쓰며 한 번 쓰면 바로 지웁니다.
    ticket-ttl: 30s
    # R-RT-02: SDP 는 몇 KB 까지 커집니다. 넉넉히 두되 한도는 둡니다.
    max-message-bytes: 65536
    # R-RT-02: 짧은 ICE 후보 묶음은 허용하되 한 연결이 서버와 Redis를 독점하지 못하게 합니다.
    messages-per-second: 20
    message-burst: 40
    # R-RT-03: 일시적인 초과에는 오류로 답하고 반복되면 정책 위반으로 연결을 닫습니다.
    rate-limit-violations-before-close: 3
    # 한 연결이 이 시간 안에 받아 가지 못하거나 밀린 양이 한도를 넘으면 그 연결만 끊습니다.
    send-time-limit: 10s
    send-buffer-bytes: 524288
    # R-RT-04: 주기적으로 말을 걸어 살아 있는지 확인합니다. 기다리는 시간은 간격보다 길어야 합니다.
    heartbeat-interval: 20s
    heartbeat-timeout: 60s
    # 비우면 같은 출처만 받습니다. 운영은 프론트와 같은 도메인입니다.
    allowed-origins: []

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.a501: INFO

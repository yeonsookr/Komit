spring:
  application:
    name: service
  profiles:
    default: local
  sql:
    init:
      # 상태코드 시드(data.sql)만 실행합니다. 스키마는 JPA가 맡습니다.
      mode: always
      encoding: UTF-8
  jpa:
    open-in-view: false
    # 시드를 JPA 스키마 생성 뒤에 실행합니다.
    defer-datasource-initialization: true
    hibernate:
      # 스키마는 JPA 엔티티 매핑으로 만듭니다. Flyway는 쓰지 않습니다.
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  # WRITER | READER. 배포 환경 값으로만 주입하며 프로필과 섞지 않습니다.
  instance-role: ${APP_INSTANCE_ROLE}
  # 이 서버가 밖에서 보이는 주소. nginx 뒤에서는 경로 접두사까지 포함합니다. (예: https://komit.site/service)
  public-base-url: ${APP_PUBLIC_BASE_URL}
  auth:
    access-token-ttl: 15m
    refresh-token-ttl: 14d
  logging:
    # 이 시간을 넘긴 컨트롤러·서비스 호출은 WARN으로 남깁니다. (common/logging/LoggingAspect)
    slow-call-threshold: 1s
  realtime:
    # 티켓을 받아 WebSocket 을 여는 사이에만 쓰입니다. 한 번 쓰면 바로 지워집니다.
    ticket-ttl: 30s
    # SDP 는 몇 KB 까지 커집니다. 넉넉히 두되 한도는 둡니다.
    max-message-bytes: 65536
    # 비우면 같은 출처만 받습니다. 운영은 프론트와 같은 도메인입니다.
    allowed-origins: []

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.a501: INFO

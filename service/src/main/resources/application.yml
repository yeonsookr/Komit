spring:
  application:
    name: service
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  # WRITER | READER. 배포 환경 값으로만 주입하며 프로필과 섞지 않습니다.
  instance-role: ${APP_INSTANCE_ROLE}
  # 이 서버가 밖에서 보이는 주소. nginx 뒤에서는 경로 접두사까지 포함합니다. (예: https://komit.site/service)
  public-base-url: ${APP_PUBLIC_BASE_URL}
  auth:
    access-token-ttl: 15m
    refresh-token-ttl: 14d

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.a501: INFO

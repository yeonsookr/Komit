stages:
  - connect
  - convention
  - build
  - test
  - sonar
  - deploy

variables:
  JIRA_KEY: "S15P21A201"                                        # Jira 프로젝트 키
  MR_TEMPLATE: ".gitlab/merge_request_templates/Default.md"     # MR 설명 템플릿
  GET_SOURCES_ATTEMPTS: 3                                       # 깃랩 CI/CD 재시도 횟수

# MR이 열려 있으면 MR 파이프라인만 (중복 방지)
workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

# 러너 연결 확인
connection-test:
  stage: connect
  tags:
    - "CI/CD"
  script:
    - echo "연결 성공!"

# 규칙 검사 공통 설정 (MR 파이프라인에서만 동작)
.convention:
  stage: convention
  tags:
    - "CI/CD"
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# 브랜치 이름 검사
# 형식: S15P21A201-<이슈번호>/<파트>/<유형>/<설명>
# 예:   S15P21A201-123/be-api/feature/request-price-comparison
branch-name:
  extends: .convention
  script:
    - |
      BRANCH="$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      echo "검사 브랜치: $BRANCH"
      if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "develop" ]; then
        echo "보호 브랜치 → 통과"; exit 0
      fi
      PARTS="fe|be-api|be-escrow|ai|infra|common"
      TYPES="feature|fix|hotfix|docs"
      PATTERN="^${JIRA_KEY}-[0-9]+/(${PARTS})/(${TYPES})/[A-Za-z0-9_-]+$"
      if printf '%s' "$BRANCH" | grep -Eq "$PATTERN"; then
        echo "OK: 브랜치 이름 규칙 통과"
      else
        echo "FAIL: 브랜치 이름 규칙 위반"
        echo "  형식 : ${JIRA_KEY}-<이슈번호>/<파트>/<유형>/<설명>"
        echo "  파트  : ${PARTS}"
        echo "  유형  : ${TYPES}"
        echo "  설명  : 영문·숫자와 하이픈(-)·언더스코어(_)"
        echo "  예)   ${JIRA_KEY}-123/be-api/feature/request-price-comparison"
        echo "  참고 : docs/git_guide.md 1. 브랜치 전략"
        exit 1
      fi

# 병합 대상 브랜치 검사 (main은 develop 또는 hotfix에서만 병합)
target-branch:
  extends: .convention
  script:
    - |
      SOURCE="$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      TARGET="$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      echo "$SOURCE -> $TARGET"
      case "$TARGET" in
        develop)
          echo "OK: develop 통합 대상" ;;
        main)
          if [ "$SOURCE" = "develop" ] || printf '%s' "$SOURCE" | grep -Eq "/hotfix/"; then
            echo "OK: main 병합 대상"
          else
            echo "FAIL: main에는 develop 또는 hotfix 브랜치만 병합할 수 있습니다."
            echo "  참고 : docs/git_guide.md 1.3 유형 구분"
            exit 1
          fi ;;
        *)
          echo "OK: 작업 브랜치 간 병합" ;;
      esac

# 커밋 메시지 검사
# 형식: <type>(<scope>): <subject> [Jira ID]
# 예:   feat(auth): 카카오 소셜 로그인 연동 기능 추가 [S15P21A201-234]
commit-message:
  extends: .convention
  variables:
    GIT_DEPTH: "0"
  before_script:
    - command -v git >/dev/null 2>&1 || apk add --no-cache git
  script:
    - |
      TYPES="feat|fix|docs|style|refactor|test|chore"
      PATTERN="^(${TYPES})(\([A-Za-z0-9._/-]+\))?: .+"
      if ! git log --no-merges --format=%s "${CI_MERGE_REQUEST_DIFF_BASE_SHA}..HEAD" > /tmp/msgs.txt; then
        echo "FAIL: 커밋 목록을 가져오지 못했습니다. (base=${CI_MERGE_REQUEST_DIFF_BASE_SHA})"
        exit 1
      fi
      if [ ! -s /tmp/msgs.txt ]; then
        echo "FAIL: 검사할 커밋이 없습니다."
        exit 1
      fi
      FAIL=0
      while IFS= read -r MSG; do
        [ -z "$MSG" ] && continue
        if ! printf '%s' "$MSG" | grep -Eq "$PATTERN"; then
          echo "FAIL: $MSG"; FAIL=1; continue
        fi
        # 대괄호 표기가 있으면 Jira ID 형식이어야 함
        if printf '%s' "$MSG" | grep -q '\[' && \
           ! printf '%s' "$MSG" | grep -Eq "\[${JIRA_KEY}-[0-9]+\]$"; then
          echo "FAIL: $MSG  (Jira ID 표기 오류 → [${JIRA_KEY}-234])"; FAIL=1; continue
        fi
        echo "OK  : $MSG"
      done < /tmp/msgs.txt
      if [ "$FAIL" -ne 0 ]; then
        echo "커밋 메시지 형식: <type>(<scope>): <subject> [Jira ID]"
        echo "  타입 : ${TYPES}"
        echo "  예)  feat(auth): 카카오 소셜 로그인 연동 기능 추가 [${JIRA_KEY}-234]"
        echo "  참고 : docs/git_guide.md 2. 커밋 메시지 규칙"
        exit 1
      fi

### 빌드 파이프라인 ###
# MR에서 해당 모듈이 바뀌었을 때만 돕니다.
# 뒤따르는 test·sonar 잡이 여기서 나온 컴파일 결과를 아티팩트로 받아 씁니다.

# Gradle 모듈 공통 설정
.gradle-job:
  image: eclipse-temurin:21-jdk-noble
  tags:
    - "CI/CD"
  allow_failure: false

# 서비스 서버 빌드
service-build:
  extends: .gradle-job
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - service/**/*
    - when: never
  script:
    - cd service
    - chmod +x gradlew
    - ./gradlew clean assemble --no-daemon
  artifacts:
    paths:
      - service/build/libs/*.jar
      - service/build/classes/java/main/
    expire_in: 1 day

# 에스크로 서버 빌드
escrow-build:
  extends: .gradle-job
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - escrow/**/*
    - when: never
  script:
    - cd escrow
    - chmod +x gradlew
    - ./gradlew clean assemble --no-daemon
  artifacts:
    paths:
      - escrow/build/libs/*.jar
      - escrow/build/classes/java/main/
    expire_in: 1 day

# 프론트엔드 빌드
fe-build:
  stage: build
  image: node:24-alpine
  tags:
    - "CI/CD"
  allow_failure: false
  variables:
    NEXT_TELEMETRY_DISABLED: "1"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - fe/**/*
    - when: never
  script:
    - cd fe
    - npm ci
    - npm run build

### 테스트 파이프라인 ###
# 커버리지 리포트를 아티팩트로 남깁니다. 뒤의 sonar 잡이 이 파일을 읽습니다.

# Spring Boot 테스트용 PostgreSQL 공통 설정
# @SpringBootTest가 실제 DataSource를 요구하므로 서비스 컨테이너를 붙입니다.
.gradle-test:
  extends: .gradle-job
  stage: test
  services:
    - name: postgres:18.6-alpine
      alias: postgres
  variables:
    POSTGRES_DB: komit
    POSTGRES_USER: komit
    POSTGRES_PASSWORD: komit-ci
    DB_URL: jdbc:postgresql://postgres:5432/komit
    DB_USERNAME: komit
    DB_PASSWORD: komit-ci
    APP_INSTANCE_ROLE: WRITER

# 서비스 서버 테스트 + JaCoCo 커버리지
# service의 Redis 통합 테스트는 Testcontainers로 격리된 Redis를 띄우므로 Docker 데몬(dind)이 필요합니다.
# services는 상속 시 병합되지 않고 덮어써 PostgreSQL도 함께 다시 적습니다.
# --tls=false: TLS 없이 TCP로 열 때 데몬이 기동을 의도적으로 지연하는 것을 막습니다. (Testcontainers GitLab CI 문서)
service-test:
  extends: .gradle-test
  services:
    - name: postgres:18.6-alpine
      alias: postgres
    - name: docker:29.6.2-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  needs:
    - job: service-build
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - service/**/*
    - when: never
  script:
    - cd service
    - chmod +x gradlew
    - ./gradlew test jacocoTestReport --no-daemon
  artifacts:
    when: always
    paths:
      - service/build/reports/jacoco/test/jacocoTestReport.xml
      - service/build/classes/java/main/
    reports:
      junit: service/build/test-results/test/*.xml
    expire_in: 1 day

# 에스크로 서버 테스트 + JaCoCo 커버리지
escrow-test:
  extends: .gradle-test
  needs:
    - job: escrow-build
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - escrow/**/*
    - when: never
  script:
    - cd escrow
    - chmod +x gradlew
    - ./gradlew test jacocoTestReport --no-daemon
  artifacts:
    when: always
    paths:
      - escrow/build/reports/jacoco/test/jacocoTestReport.xml
      - escrow/build/classes/java/main/
    reports:
      junit: escrow/build/test-results/test/*.xml
    expire_in: 1 day

# 프론트엔드 단위 테스트 + lcov 커버리지
fe-test:
  stage: test
  image: node:24-alpine
  tags:
    - "CI/CD"
  allow_failure: false
  needs:
    - job: fe-build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - fe/**/*
    - when: never
  script:
    - cd fe
    - npm ci
    - npm run test:coverage
  artifacts:
    when: always
    paths:
      - fe/coverage/lcov.info
    expire_in: 1 day

### 소나큐브 분석 파이프라인 ###
# SONAR_HOST_URL, SONAR_TOKEN은 GitLab CI/CD Variables에서 주입합니다.
# 프로젝트 키를 모듈마다 따로 두어 한 소나큐브 서버에 세 프로젝트로 나뉘게 합니다.

# 스캐너 공통 설정
.sonar-scanner:
  stage: sonar
  image:
    name: sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1
    entrypoint: [""]
  tags:
    - "CI/CD"
  allow_failure: false
  before_script:
    - |
      test -n "$SONAR_TOKEN" || { echo "SONAR_TOKEN is required"; exit 1; }
      test -n "$SONAR_HOST_URL" || { echo "SONAR_HOST_URL is required"; exit 1; }

# 서비스 서버 소나큐브 분석 의뢰
service-sonar:
  extends: .sonar-scanner
  needs:
    - job: service-test
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - service/**/*
    - when: never
  script:
    - |
      cd service
      test -d build/classes/java/main || {
        echo "컴파일된 클래스가 없습니다. service-build 아티팩트를 확인하세요."
        exit 1
      }
      test -f build/reports/jacoco/test/jacocoTestReport.xml || {
        echo "JaCoCo XML 리포트가 없습니다. service-test 아티팩트를 확인하세요."
        exit 1
      }
      sonar-scanner \
        -Dsonar.host.url="$SONAR_HOST_URL" \
        -Dsonar.token="$SONAR_TOKEN" \
        -Dsonar.projectKey="${CI_PROJECT_PATH_SLUG}-service" \
        -Dsonar.projectName="${CI_PROJECT_NAME}-service" \
        -Dsonar.projectVersion="$CI_PIPELINE_ID" \
        -Dsonar.sources=src/main/java \
        -Dsonar.tests=src/test/java \
        -Dsonar.java.binaries=build/classes/java/main \
        -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml \
        -Dsonar.sourceEncoding=UTF-8 \
        -Dsonar.scm.revision="$CI_COMMIT_SHA"

# 에스크로 서버 소나큐브 분석 의뢰
escrow-sonar:
  extends: .sonar-scanner
  needs:
    - job: escrow-test
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - escrow/**/*
    - when: never
  script:
    - |
      cd escrow
      test -d build/classes/java/main || {
        echo "컴파일된 클래스가 없습니다. escrow-build 아티팩트를 확인하세요."
        exit 1
      }
      test -f build/reports/jacoco/test/jacocoTestReport.xml || {
        echo "JaCoCo XML 리포트가 없습니다. escrow-test 아티팩트를 확인하세요."
        exit 1
      }
      sonar-scanner \
        -Dsonar.host.url="$SONAR_HOST_URL" \
        -Dsonar.token="$SONAR_TOKEN" \
        -Dsonar.projectKey="${CI_PROJECT_PATH_SLUG}-escrow" \
        -Dsonar.projectName="${CI_PROJECT_NAME}-escrow" \
        -Dsonar.projectVersion="$CI_PIPELINE_ID" \
        -Dsonar.sources=src/main/java \
        -Dsonar.tests=src/test/java \
        -Dsonar.java.binaries=build/classes/java/main \
        -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml \
        -Dsonar.sourceEncoding=UTF-8 \
        -Dsonar.scm.revision="$CI_COMMIT_SHA"

# 프론트엔드 소나큐브 분석 의뢰
fe-sonar:
  extends: .sonar-scanner
  needs:
    - job: fe-test
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - fe/**/*
    - when: never
  script:
    - |
      cd fe
      test -f coverage/lcov.info || {
        echo "lcov 리포트가 없습니다. fe-test 아티팩트를 확인하세요."
        exit 1
      }
      sonar-scanner \
        -Dsonar.host.url="$SONAR_HOST_URL" \
        -Dsonar.token="$SONAR_TOKEN" \
        -Dsonar.projectKey="${CI_PROJECT_PATH_SLUG}-fe" \
        -Dsonar.projectName="${CI_PROJECT_NAME}-fe" \
        -Dsonar.projectVersion="$CI_PIPELINE_ID" \
        -Dsonar.sources=src \
        -Dsonar.tests=src \
        -Dsonar.test.inclusions="src/**/*.test.ts,src/**/*.test.tsx" \
        -Dsonar.exclusions="**/*.d.ts" \
        -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
        -Dsonar.sourceEncoding=UTF-8 \
        -Dsonar.scm.revision="$CI_COMMIT_SHA"

### 퀄리티게이트 ###
# 지금은 수동 실행 전용입니다. 파이프라인에 버튼으로만 남고 자동으로 돌지 않으며,
# 실패해도(allow_failure) MR을 막지 않습니다.
# 팀이 기준을 합의하면 각 잡 rules에서 when·allow_failure 두 줄만 지우면
# 소나 뒤에 자동으로 붙는 차단 게이트가 됩니다.

# 퀄리티게이트 공통 설정
# 소나큐브 분석은 비동기라 스캐너 잡이 끝나도 결과가 바로 나오지 않습니다.
# 이번 커밋(revision)에 해당하는 분석이 서버에 올라올 때까지 기다린 뒤 판정을 읽습니다.
.quality-gate:
  stage: sonar
  image: alpine:3.22
  tags:
    - "CI/CD"
  allow_failure: true
  before_script:
    - apk add --no-cache curl jq
    - |
      test -n "$SONAR_TOKEN" || { echo "SONAR_TOKEN is required"; exit 1; }
      test -n "$SONAR_HOST_URL" || { echo "SONAR_HOST_URL is required"; exit 1; }
      test -n "$SONAR_PROJECT_KEY" || { echo "SONAR_PROJECT_KEY job variable is required"; exit 1; }
  script:
    - |
      ANALYSIS_ID=""

      for ATTEMPT in $(seq 1 60); do
        ANALYSIS_ID="$(curl --fail --silent --show-error \
          --user "${SONAR_TOKEN}:" \
          --get "${SONAR_HOST_URL%/}/api/project_analyses/search" \
          --data-urlencode "project=${SONAR_PROJECT_KEY}" \
          --data-urlencode "ps=20" |
          jq -r --arg rev "$CI_COMMIT_SHA" \
            'first(.analyses[] | select(.revision == $rev) | .key) // empty')" || exit 1

        [ -n "$ANALYSIS_ID" ] && break
        echo "소나큐브 분석 결과 대기 중 (${ATTEMPT}/60)..."
        sleep 5
      done

      test -n "$ANALYSIS_ID" || {
        echo "300초 안에 소나큐브 분석이 끝나지 않았습니다."
        exit 1
      }

      STATUS="$(curl --fail --silent --show-error \
        --user "${SONAR_TOKEN}:" \
        --get "${SONAR_HOST_URL%/}/api/qualitygates/project_status" \
        --data-urlencode "analysisId=${ANALYSIS_ID}" |
        jq -r '.projectStatus.status')" || exit 1

      echo "SonarQube Quality Gate: $STATUS"
      test "$STATUS" = "OK"

# 서비스 서버 퀄리티게이트 (수동)
service-qg:
  extends: .quality-gate
  needs:
    - job: service-sonar
  variables:
    SONAR_PROJECT_KEY: "${CI_PROJECT_PATH_SLUG}-service"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - service/**/*
      when: manual
      allow_failure: true
    - when: never

# 에스크로 서버 퀄리티게이트 (수동)
escrow-qg:
  extends: .quality-gate
  needs:
    - job: escrow-sonar
  variables:
    SONAR_PROJECT_KEY: "${CI_PROJECT_PATH_SLUG}-escrow"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - escrow/**/*
      when: manual
      allow_failure: true
    - when: never

# 프론트엔드 퀄리티게이트 (수동)
fe-qg:
  extends: .quality-gate
  needs:
    - job: fe-sonar
  variables:
    SONAR_PROJECT_KEY: "${CI_PROJECT_PATH_SLUG}-fe"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - fe/**/*
      when: manual
      allow_failure: true
    - when: never

### Docker 이미지 빌드/푸시 파이프라인 ###
# 레지스트리 정보와 인증값은 GitLab CI/CD Variables에서 주입합니다.
# MR에서 빌드·테스트·소나를 통과하고 develop에 병합된 뒤에만 이미지를 굽습니다.

# 도커 빌드/푸시 공통 설정
# 확장하는 잡은 IMAGE_NAME(도커허브 리포지터리 이름)과
# BUILD_CONTEXT(Dockerfile이 있는 디렉터리)를 반드시 지정해야 합니다.
# 빌드에 필요한 CI/CD 변수가 있으면 BUILD_ARG_NAMES에 공백으로 구분해 적습니다.
.docker-build-push:
  stage: deploy
  image: docker:29.6.2-cli
  services:
    - name: docker:29.6.2-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  tags:
    - "CI/CD"
  allow_failure: false
  before_script:
    - |
      test -n "$DOCKER_REGISTRY" || {
        echo "DOCKER_REGISTRY CI/CD variable is required"
        exit 1
      }
      test -n "$DOCKER_REGISTRY_USERNAME" || {
        echo "DOCKER_REGISTRY_USERNAME CI/CD variable is required"
        exit 1
      }
      test -n "$DOCKER_REGISTRY_TOKEN" || {
        echo "DOCKER_REGISTRY_TOKEN CI/CD variable is required"
        exit 1
      }
      test -n "$IMAGE_NAME" || {
        echo "IMAGE_NAME job variable is required"
        exit 1
      }
      test -n "$BUILD_CONTEXT" || {
        echo "BUILD_CONTEXT job variable is required"
        exit 1
      }

      case "$DOCKER_REGISTRY" in
        *://*|*/)
          echo "DOCKER_REGISTRY must be a registry host without a scheme or trailing slash"
          exit 1
          ;;
      esac

      printf '%s' "$DOCKER_REGISTRY_TOKEN" |
        docker login "$DOCKER_REGISTRY" \
          --username "$DOCKER_REGISTRY_USERNAME" \
          --password-stdin
  script:
    - |
      IMAGE_REPOSITORY="${DOCKER_REGISTRY}/${DOCKER_REGISTRY_USERNAME}/${IMAGE_NAME}"
      COMMIT_IMAGE="${IMAGE_REPOSITORY}:${CI_COMMIT_SHORT_SHA}"

      # BUILD_ARG_NAMES에 적은 CI/CD 변수를 이름만 넘겨, 값이 명령줄에 찍히지 않게 합니다.
      set --
      for NAME in ${BUILD_ARG_NAMES:-}; do
        eval "VALUE=\${$NAME:-}"
        test -n "$VALUE" || {
          echo "$NAME CI/CD variable is required"
          exit 1
        }
        set -- "$@" --build-arg "$NAME"
      done

      docker build --pull "$@" --tag "$COMMIT_IMAGE" "$BUILD_CONTEXT"
      docker push "$COMMIT_IMAGE"

      if [ "$CI_COMMIT_BRANCH" = "develop" ]; then
        LATEST_IMAGE="${IMAGE_REPOSITORY}:latest"
        docker tag "$COMMIT_IMAGE" "$LATEST_IMAGE"
        docker push "$LATEST_IMAGE"
      fi

      echo "Published Docker image: $COMMIT_IMAGE"

      # K3s 배포 잡이 이번에 빌드된 이미지만 교체하도록 이미지 주소를 넘깁니다.
      : > image.env
      if [ -n "${IMAGE_ENV_NAME:-}" ]; then
        printf '%s=%s\n' "$IMAGE_ENV_NAME" "$COMMIT_IMAGE" > image.env
      fi
  artifacts:
    reports:
      dotenv: image.env
    expire_in: 1 day
  after_script:
    - docker logout "$DOCKER_REGISTRY" >/dev/null 2>&1 || true

# 목 서버 도커 빌드/도커허브 푸시
mock-docker-build-push:
  extends: .docker-build-push
  variables:
    IMAGE_NAME: komit-mock
    BUILD_CONTEXT: mock
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes:
        - mock/**/*
    - when: never

# 서비스 서버 도커 빌드/도커허브 푸시
service-docker-build-push:
  extends: .docker-build-push
  variables:
    IMAGE_NAME: komit-service
    BUILD_CONTEXT: service
    IMAGE_ENV_NAME: SERVICE_IMAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes:
        - service/**/*
    - when: never

# 에스크로 서버 도커 빌드/도커허브 푸시
escrow-docker-build-push:
  extends: .docker-build-push
  variables:
    IMAGE_NAME: komit-escrow
    BUILD_CONTEXT: escrow
    IMAGE_ENV_NAME: ESCROW_IMAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes:
        - escrow/**/*
    - when: never

# 프론트엔드 도커 빌드/도커허브 푸시
fe-docker-build-push:
  extends: .docker-build-push
  variables:
    IMAGE_NAME: komit-fe
    BUILD_CONTEXT: fe
    BUILD_ARG_NAMES: BACKEND_API_BASE_URL AI_API_BASE_URL
    IMAGE_ENV_NAME: FE_IMAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes:
        - fe/**/*
    - when: never

# mock을 보는 테스트용 FE 도커 빌드/도커허브 푸시.
# 같은 소스를 /test 접두사(basePath)로 구워 별도 이미지로 올립니다. basePath 는 빌드 시점 값이라
# 루트 fe 이미지와 같은 이미지를 쓸 수 없습니다. API 주소는 TEST_* CI/CD 변수를 빌드 인자 이름에
# 맞춰 이 잡 안에서만 매핑하고, 배포 시에도 fe-test-config에 별도로 주입합니다.
fe-test-docker-build-push:
  extends: .docker-build-push
  variables:
    IMAGE_NAME: komit-fe-test
    BUILD_CONTEXT: fe
    BASE_PATH: /test
    BACKEND_API_BASE_URL: "$TEST_BACKEND_API_BASE_URL"
    AI_API_BASE_URL: "$TEST_AI_API_BASE_URL"
    BUILD_ARG_NAMES: BACKEND_API_BASE_URL AI_API_BASE_URL BASE_PATH
    IMAGE_ENV_NAME: FE_TEST_IMAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes:
        - fe/**/*
    - when: never

# SSH로 배포 서버에 접속 후 Docker Compose
mock-docker-deploy:
  stage: deploy
  image: alpine:3.22
  needs:
    - job: mock-docker-build-push
  tags:
    - "CI/CD"
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes:
        - mock/**/*
    - when: never
  before_script:
    - apk add --no-cache openssh-client
    - |
      test -n "$SSH_ADDRESS" || {
        echo "SSH_ADDRESS CI/CD variable is required (for example: user@example.com)"
        exit 1
      }
      test -n "$SSH_PRIVATE_KEY" || {
        echo "SSH_PRIVATE_KEY CI/CD variable is required"
        exit 1
      }

      install -d -m 700 "$HOME/.ssh"

      if [ -f "$SSH_PRIVATE_KEY" ]; then
        cp "$SSH_PRIVATE_KEY" "$HOME/.ssh/id_deploy"
      else
        printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_deploy"
      fi

      chmod 600 "$HOME/.ssh/id_deploy"
  script:
    - |
      ssh \
        -i "$HOME/.ssh/id_deploy" \
        -o BatchMode=yes \
        -o StrictHostKeyChecking=accept-new \
        "$SSH_ADDRESS" \
        'cd "$HOME/mock" &&
        sudo -n docker compose up -d --pull always &&
        sudo -n docker compose ps'

# SSH로 배포 서버에 접속 후 K3s에 service·escrow·fe 배포
# 이번 파이프라인에서 빌드된 이미지만 교체하고, 빌드되지 않은 모듈은 서버에서 돌고 있는 이미지를 유지합니다.
# DB 비밀번호는 SERVICE_DB_PASSWORD, ESCROW_DB_PASSWORD, Redis 비밀번호는 SERVICE_REDIS_PASSWORD CI/CD 변수(Masked, Protected)로 주입합니다.
# service 인증 값(KOMIT_USER_JWT_SECRET, KAKAO_TOKEN_ENCRYPTION_KEY, KAKAO_CLIENT_SECRET)도 같은 방식이며 deploy.sh가 service-auth Secret으로 만듭니다.
# 파일 저장소 자격(STORAGE_ACCESS_KEY, STORAGE_SECRET_KEY)은 service-storage Secret, 주소(STORAGE_INTERNAL_ENDPOINT, STORAGE_PUBLIC_ENDPOINT)는 service-config ConfigMap으로 만듭니다.
# MinIO 자체도 deploy.sh가 같은 클러스터에 올립니다(deploy/k3s/base/minio.yaml). 자격은 MinIO 루트 계정으로도 쓰입니다.
k3s-deploy:
  stage: deploy
  image: alpine:3.22
  needs:
    - job: service-docker-build-push
      optional: true
    - job: escrow-docker-build-push
      optional: true
    - job: fe-docker-build-push
      optional: true
    - job: fe-test-docker-build-push
      optional: true
  tags:
    - "CI/CD"
  allow_failure: false
  # 배포가 겹치지 않도록 한 번에 하나씩만 실행합니다.
  resource_group: k3s-deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes:
        - service/**/*
        - escrow/**/*
        - fe/**/*
        - deploy/k3s/**/*
    - when: never
  before_script:
    - apk add --no-cache openssh-client tar
    - |
      for NAME in SSH_ADDRESS SSH_PRIVATE_KEY SERVICE_DB_PASSWORD ESCROW_DB_PASSWORD SERVICE_REDIS_PASSWORD SERVICE_PUBLIC_BASE_URL ESCROW_PUBLIC_BASE_URL BACKEND_API_BASE_URL AI_API_BASE_URL TEST_BACKEND_API_BASE_URL TEST_AI_API_BASE_URL ESCROW_API_BASE_URL ESCROW_CLIENT_API_KEY ESCROW_CLIENT_ONE_WON_AUTH_MESSAGE ESCROW_ADMIN_USERNAME ESCROW_ADMIN_PASSWORD_HASH KAKAO_CLIENT_ID KAKAO_REDIRECT_URI TEST_KAKAO_REDIRECT_URI KOMIT_USER_JWT_SECRET KAKAO_TOKEN_ENCRYPTION_KEY ACCOUNT_DATA_ENCRYPTION_KEY KAKAO_CLIENT_SECRET STORAGE_INTERNAL_ENDPOINT STORAGE_PUBLIC_ENDPOINT STORAGE_ACCESS_KEY STORAGE_SECRET_KEY CLIENT_API_KEY_HMAC_SECRET SENSITIVE_DATA_HMAC_SECRET FIELD_ENCRYPTION_KEY_BASE64 OPERATOR_CLIENT_API_KEY SSAFY_FINANCE_API_KEY SSAFY_DEMAND_DEPOSIT_PRODUCT_NO SSAFY_ESCROW_USER_KEY SSAFY_ESCROW_ACCOUNT_NO SSAFY_FEE_ACCOUNT_NO SSAFY_VIRTUAL_ACCOUNT_VALIDITY_DAYS; do
        eval "VALUE=\${$NAME:-}"
        test -n "$VALUE" || {
          echo "$NAME CI/CD variable is required"
          exit 1
        }
      done

      install -d -m 700 "$HOME/.ssh"

      if [ -f "$SSH_PRIVATE_KEY" ]; then
        cp "$SSH_PRIVATE_KEY" "$HOME/.ssh/id_deploy"
      else
        printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_deploy"
      fi

      chmod 600 "$HOME/.ssh/id_deploy"
  script:
    - |
      SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new"

      echo "service image: ${SERVICE_IMAGE:-(유지)}"
      echo "escrow image:  ${ESCROW_IMAGE:-(유지)}"
      echo "fe image:      ${FE_IMAGE:-(유지)}"
      echo "fe-test image: ${FE_TEST_IMAGE:-(유지)}"

      # 서버에는 소스를 두지 않고 배포에 필요한 deploy/k3s만 매번 새로 올립니다.
      tar -C deploy -czf - k3s |
        $SSH "$SSH_ADDRESS" 'rm -rf "$HOME/komit-k3s" && mkdir -p "$HOME/komit-k3s" && tar -xzf - -C "$HOME/komit-k3s"'

      # 비밀번호는 명령줄 인자에 싣지 않고 표준입력으로 보내 서버 프로세스 목록에 남기지 않습니다.
      b64() { printf '%s' "$1" | base64 | tr -d '\n'; }
      {
        echo 'set -eu'
        echo "export SERVICE_DB_PASSWORD=\"\$(printf %s '$(b64 "$SERVICE_DB_PASSWORD")' | base64 -d)\""
        echo "export ESCROW_DB_PASSWORD=\"\$(printf %s '$(b64 "$ESCROW_DB_PASSWORD")' | base64 -d)\""
        echo "export SERVICE_REDIS_PASSWORD=\"\$(printf %s '$(b64 "$SERVICE_REDIS_PASSWORD")' | base64 -d)\""
        # 백엔드가 밖에서 보이는 주소. 리다이렉트·절대 URL 생성에 씁니다.
        echo "export SERVICE_PUBLIC_BASE_URL=\"\$(printf %s '$(b64 "$SERVICE_PUBLIC_BASE_URL")' | base64 -d)\""
        echo "export ESCROW_PUBLIC_BASE_URL=\"\$(printf %s '$(b64 "$ESCROW_PUBLIC_BASE_URL")' | base64 -d)\""
        echo "export SERVICE_IMAGE='${SERVICE_IMAGE:-}'"
        echo "export ESCROW_IMAGE='${ESCROW_IMAGE:-}'"
        echo "export FE_IMAGE='${FE_IMAGE:-}'"
        echo "export FE_TEST_IMAGE='${FE_TEST_IMAGE:-}'"
        # 루트 FE와 /test FE의 주소 변수를 서로 다른 ConfigMap에 넣습니다.
        echo "export BACKEND_API_BASE_URL=\"\$(printf %s '$(b64 "$BACKEND_API_BASE_URL")' | base64 -d)\""
        echo "export AI_API_BASE_URL=\"\$(printf %s '$(b64 "$AI_API_BASE_URL")' | base64 -d)\""
        echo "export TEST_BACKEND_API_BASE_URL=\"\$(printf %s '$(b64 "$TEST_BACKEND_API_BASE_URL")' | base64 -d)\""
        echo "export TEST_AI_API_BASE_URL=\"\$(printf %s '$(b64 "$TEST_AI_API_BASE_URL")' | base64 -d)\""
        echo "export ESCROW_API_BASE_URL=\"\$(printf %s '$(b64 "$ESCROW_API_BASE_URL")' | base64 -d)\""
        echo "export ESCROW_CLIENT_API_KEY=\"\$(printf %s '$(b64 "$ESCROW_CLIENT_API_KEY")' | base64 -d)\""
        echo "export ESCROW_CLIENT_ONE_WON_AUTH_MESSAGE=\"\$(printf %s '$(b64 "$ESCROW_CLIENT_ONE_WON_AUTH_MESSAGE")' | base64 -d)\""
        echo "export ESCROW_ADMIN_USERNAME=\"\$(printf %s '$(b64 "$ESCROW_ADMIN_USERNAME")' | base64 -d)\""
        echo "export ESCROW_ADMIN_PASSWORD_HASH=\"\$(printf %s '$(b64 "$ESCROW_ADMIN_PASSWORD_HASH")' | base64 -d)\""
        # 카카오 로그인. fe 의 /api/auth/kakao 가 실행 시점에 읽습니다. 없으면 로그인이 500 으로 실패합니다.
        echo "export KAKAO_CLIENT_ID=\"\$(printf %s '$(b64 "$KAKAO_CLIENT_ID")' | base64 -d)\""
        echo "export KAKAO_REDIRECT_URI=\"\$(printf %s '$(b64 "$KAKAO_REDIRECT_URI")' | base64 -d)\""
        # /test FE의 Redirect URI. 루트 콜백과 섞이면 로그인 뒤 루트로 빠집니다.
        echo "export TEST_KAKAO_REDIRECT_URI=\"\$(printf %s '$(b64 "$TEST_KAKAO_REDIRECT_URI")' | base64 -d)\""
        # service 인증. JWT 서명 키, 카카오 토큰 암호화 키(32바이트 Base64), 카카오 Client Secret. 없으면 service가 기동하지 않습니다.
        echo "export KOMIT_USER_JWT_SECRET=\"\$(printf %s '$(b64 "$KOMIT_USER_JWT_SECRET")' | base64 -d)\""
        echo "export KAKAO_TOKEN_ENCRYPTION_KEY=\"\$(printf %s '$(b64 "$KAKAO_TOKEN_ENCRYPTION_KEY")' | base64 -d)\""
        # 계좌번호·userKey 암호화 키(32바이트 Base64). 없으면 service Pod 가 기동 중 죽습니다.
        echo "export ACCOUNT_DATA_ENCRYPTION_KEY=\"\$(printf %s '$(b64 "$ACCOUNT_DATA_ENCRYPTION_KEY")' | base64 -d)\""
        echo "export KAKAO_CLIENT_SECRET=\"\$(printf %s '$(b64 "$KAKAO_CLIENT_SECRET")' | base64 -d)\""
        # 파일 저장소(MinIO). 내부 주소는 service Pod가 부르고(minio.komit.svc.cluster.local:9000), 공개 주소는 브라우저가 열
        # 프리사인 URL의 호스트(https://file.komit.site)입니다. 경로가 붙은 주소는 deploy.sh가 거부합니다.
        # 자격은 deploy.sh가 service-storage Secret으로, 주소·버킷은 service-config ConfigMap으로 만듭니다. STORAGE_BUCKET은 비우면 komit입니다.
        echo "export STORAGE_INTERNAL_ENDPOINT=\"\$(printf %s '$(b64 "$STORAGE_INTERNAL_ENDPOINT")' | base64 -d)\""
        echo "export STORAGE_PUBLIC_ENDPOINT=\"\$(printf %s '$(b64 "$STORAGE_PUBLIC_ENDPOINT")' | base64 -d)\""
        echo "export STORAGE_ACCESS_KEY=\"\$(printf %s '$(b64 "$STORAGE_ACCESS_KEY")' | base64 -d)\""
        echo "export STORAGE_SECRET_KEY=\"\$(printf %s '$(b64 "$STORAGE_SECRET_KEY")' | base64 -d)\""
        echo "export STORAGE_BUCKET=\"\$(printf %s '$(b64 "${STORAGE_BUCKET:-}")' | base64 -d)\""
        # escrow 내부 API 인증·민감정보 보호와 SSAFY 입출금 상품 설정.
        # application.yml에 운영 환경변수를 추가하면 필수 변수 검사와 이 전달 목록도 같은 MR에서 갱신합니다.
        echo "export CLIENT_API_KEY_HMAC_SECRET=\"\$(printf %s '$(b64 "$CLIENT_API_KEY_HMAC_SECRET")' | base64 -d)\""
        echo "export SENSITIVE_DATA_HMAC_SECRET=\"\$(printf %s '$(b64 "$SENSITIVE_DATA_HMAC_SECRET")' | base64 -d)\""
        echo "export FIELD_ENCRYPTION_KEY_BASE64=\"\$(printf %s '$(b64 "$FIELD_ENCRYPTION_KEY_BASE64")' | base64 -d)\""
        echo "export OPERATOR_CLIENT_API_KEY=\"\$(printf %s '$(b64 "$OPERATOR_CLIENT_API_KEY")' | base64 -d)\""
        echo "export SSAFY_FINANCE_API_KEY=\"\$(printf %s '$(b64 "$SSAFY_FINANCE_API_KEY")' | base64 -d)\""
        echo "export SSAFY_DEMAND_DEPOSIT_PRODUCT_NO=\"\$(printf %s '$(b64 "$SSAFY_DEMAND_DEPOSIT_PRODUCT_NO")' | base64 -d)\""
        echo "export SSAFY_ESCROW_USER_KEY=\"\$(printf %s '$(b64 "$SSAFY_ESCROW_USER_KEY")' | base64 -d)\""
        echo "export SSAFY_ESCROW_ACCOUNT_NO=\"\$(printf %s '$(b64 "$SSAFY_ESCROW_ACCOUNT_NO")' | base64 -d)\""
        echo "export SSAFY_FEE_ACCOUNT_NO=\"\$(printf %s '$(b64 "$SSAFY_FEE_ACCOUNT_NO")' | base64 -d)\""
        echo "export SSAFY_VIRTUAL_ACCOUNT_VALIDITY_DAYS=\"\$(printf %s '$(b64 "$SSAFY_VIRTUAL_ACCOUNT_VALIDITY_DAYS")' | base64 -d)\""
        echo 'sh "$1/komit-k3s/k3s/deploy.sh"'
      } | $SSH "$SSH_ADDRESS" 'sudo -n sh -s "$HOME"'

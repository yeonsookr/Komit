# 로컬 개발용 통화 중계(TURN) 설정. 운영 설정이 아니다.
#
# 운영으로 가져갈 때 반드시 바꿀 것이 셋이다.
#   - external-ip     서버의 공인 IP. 이것이 틀리면 후보는 생기는데 연결이 안 된다
#   - static-auth-secret  아래 값은 저장소에 있으므로 비밀이 아니다
#   - no-tls / no-dtls    운영에서는 인증서를 달고 켠다

listening-port=3478

# 도커 안에서는 자기 주소가 172.x 다. 그대로 두면 브라우저가 닿을 수 없는 주소를 중계
# 주소로 알려 줘, 중계 후보는 생기는데 연결이 안 되는 상태가 된다.
external-ip=127.0.0.1

# 중계 포트 범위. 기본값(49152-65535)은 도커로 다 열 수 없어 좁혔다.
# docker-compose.yml 의 포트 매핑과 같아야 한다.
min-port=49160
max-port=49200

# 시한부 자격. 서버가 공유 비밀로 자격을 만들고 여기서 같은 계산으로 맞춰 본다.
# 계정을 미리 만들지 않으므로 사용자 목록이 없다.
use-auth-secret
static-auth-secret=local-only-not-a-real-secret
realm=komit.local

# ─────────────────────────────────────────────────────────────────────────────
# 운영에서 반드시 넣을 것 — 여기(로컬)에는 일부러 넣지 않았다
#
# TURN 은 임의의 주소로 패킷을 보낼 수 있다. 그래서 자격을 가진 사람이 중계기를 통해
# **밖에서 못 닿는 내부 서비스**에 닿을 수 있다. 알려진 취약점이고, 운영에서 이것이 빠지면
# 중계기가 내부망 침투 통로가 된다. k3s 안의 DB·Redis·MinIO 가 그 사정권이다.
#
#   denied-peer-ip=0.0.0.0-0.255.255.255
#   denied-peer-ip=10.0.0.0-10.255.255.255
#   denied-peer-ip=127.0.0.0-127.255.255.255
#   denied-peer-ip=169.254.0.0-169.254.255.255
#   denied-peer-ip=172.16.0.0-172.31.255.255
#   denied-peer-ip=192.168.0.0-192.168.255.255
#   denied-peer-ip=224.0.0.0-255.255.255.255
#
# **로컬에 그대로 넣으면 중계 통화가 안 붙는다.** 두 브라우저의 중계 주소가 둘 다
# 127.0.0.1 이고 도커 안은 172.x 라, 위 목록이 정확히 그 둘을 막는다. 로컬에는 지킬
# 내부 서비스도 없으므로 뺀다.
# ─────────────────────────────────────────────────────────────────────────────

# 한 사람이 서버를 다 먹지 못하게 한다.
user-quota=12
total-quota=100

# 로컬에는 진짜 인증서가 없다. 자체 서명은 브라우저가 거부하므로 TLS 는 운영에서 확인한다.
no-tls
no-dtls

# 상대에게 TCP 로 내보내는 길(RFC 6062)을 닫는다. 브라우저는 쓰지 않는다 —
# `transport=tcp` 는 나와 중계 서버 사이만 TCP 라는 뜻이다. 운영과 같게 둔다.
no-tcp-relay

fingerprint

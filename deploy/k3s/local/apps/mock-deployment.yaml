apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock
  namespace: komit
  labels:
    app.kubernetes.io/name: mock
    app.kubernetes.io/part-of: komit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock
        app.kubernetes.io/part-of: komit
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock
          image: komit-mock:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

# 로컬 실습 전용 값입니다. 운영 환경에서는 이 파일을 사용하지 마세요.
# CloudNativePG가 initdb에 쓰고, Spring이 같은 Secret으로 접속합니다.
apiVersion: v1
kind: Secret
metadata:
  name: service-db-app
  namespace: komit
type: kubernetes.io/basic-auth
stringData:
  username: service
  password: komit-local-service
---
apiVersion: v1
kind: Secret
metadata:
  name: escrow-db-app
  namespace: komit
type: kubernetes.io/basic-auth
stringData:
  username: escrow
  password: komit-local-escrow

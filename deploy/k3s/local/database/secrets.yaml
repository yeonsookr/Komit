# 로컬 실습 전용 값입니다. 운영 환경에서는 이 파일을 사용하지 마세요.
# CloudNativePG가 initdb와 managed role 생성에 쓰고, Pgpool과 Spring이 같은 Secret을 읽습니다.
apiVersion: v1
kind: Secret
metadata:
  name: service-db-app
  namespace: komit
type: kubernetes.io/basic-auth
stringData:
  username: service
  password: komit-local-service
---
apiVersion: v1
kind: Secret
metadata:
  name: service-db-pgpool-monitor
  namespace: komit
type: kubernetes.io/basic-auth
stringData:
  username: pgpool_monitor
  password: komit-local-service-monitor
---
apiVersion: v1
kind: Secret
metadata:
  name: escrow-db-app
  namespace: komit
type: kubernetes.io/basic-auth
stringData:
  username: escrow
  password: komit-local-escrow
---
apiVersion: v1
kind: Secret
metadata:
  name: escrow-db-pgpool-monitor
  namespace: komit
type: kubernetes.io/basic-auth
stringData:
  username: pgpool_monitor
  password: komit-local-escrow-monitor

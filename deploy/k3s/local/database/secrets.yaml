# 로컬 실습 전용 값입니다. 운영 환경에서는 이 파일을 사용하지 마세요.
# CloudNativePG가 initdb에 쓰고, Spring이 같은 Secret으로 접속합니다.
apiVersion: v1
kind: Secret
metadata:
  name: service-db-app
  namespace: komit
type: kubernetes.io/basic-auth
stringData:
  username: service
  password: komit-local-service
---
apiVersion: v1
kind: Secret
metadata:
  name: escrow-db-app
  namespace: komit
type: kubernetes.io/basic-auth
stringData:
  username: escrow
  password: komit-local-escrow
---
# Redis(requirepass·masterauth)와 Sentinel 접속에 같은 값을 씁니다. Spring도 같은 Secret으로 접속합니다.
apiVersion: v1
kind: Secret
metadata:
  name: service-redis-auth
  namespace: komit
type: Opaque
stringData:
  password: komit-local-redis
---
# service 인증 값. 저장소에 적힌 개발 전용 값이라 운영에 쓰지 않습니다. 카카오 앱 자격이 가짜라 로컬 k3s에서 카카오 로그인은 실패합니다.
apiVersion: v1
kind: Secret
metadata:
  name: service-auth
  namespace: komit
type: Opaque
stringData:
  KOMIT_USER_JWT_SECRET: komit-user-jwt-secret-dev-only-change-me
  KAKAO_TOKEN_ENCRYPTION_KEY: ZGV2LW9ubHkta2FrYW8tdG9rZW4ta2V5LTMyYnl0ZXM=
  KAKAO_CLIENT_ID: kakao-client-id-dev-only
  KAKAO_CLIENT_SECRET: kakao-client-secret-dev-only

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: komit
  labels:
    app.kubernetes.io/name: ai
    app.kubernetes.io/part-of: komit
spec:
  # HPA를 두지 않습니다. 이 서비스는 GMS 왕복을 기다리기만 해 CPU가 거의 오르지 않아
  # CPU 지표로는 한 번도 늘지 않습니다. 다른 지표를 쓰려면 별도 어댑터가 필요합니다.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai
        app.kubernetes.io/part-of: komit
    spec:
      # GMS 왕복이 20초까지 걸립니다. 처리 중에 끊기지 않도록 service와 같은 여유를 둡니다.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ai
      containers:
        - name: ai
          image: komit-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # 키가 없으면 기동하지 않습니다. 키 없이 떠 있으면 모든 요청이 503이 되는데
            # 배포는 성공한 것처럼 보입니다. 운영은 deploy.sh가, 로컬은 local/apps가 만듭니다.
            - name: GMS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secret
                  key: GMS_API_KEY
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          # 모델을 직접 돌리지 않고 GMS 왕복을 기다리기만 해 CPU를 거의 쓰지 않습니다.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

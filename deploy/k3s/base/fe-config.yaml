# Next.js 서버가 백엔드를 호출할 때 쓰는 주소입니다. 브라우저에는 노출되지 않습니다.
# 클러스터 안에서는 Service 이름으로 스프링 Pod에 바로 접속합니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fe-config
  namespace: komit
data:
  BACKEND_API_BASE_URL: http://service.komit.svc.cluster.local:8080
  ESCROW_API_BASE_URL: http://escrow.komit.svc.cluster.local:8081
  # AI 서버는 아직 배포 대상이 아니라 목 서버의 코밋 경로를 임시로 가리킵니다. AI 서버가 생기면 교체합니다.
  AI_API_BASE_URL: https://komit.site/mock/service

# 공통 설정입니다. 백엔드 주소와 계정은 컨테이너 시작 시 entrypoint가 덧붙입니다.

backend_clustering_mode = 'streaming_replication'

listen_addresses = '*'
port = 5432
unix_socket_directories = '/tmp'
pcp_listen_addresses = ''
pcp_socket_dir = '/tmp'
pid_file_name = '/tmp/pgpool.pid'
logdir = '/tmp'

log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m: %a pid %p: '

# 인증
enable_pool_hba = on
pool_passwd = 'pool_passwd'
allow_clear_text_frontend_auth = off
ssl = off

# 커넥션 풀
# Pgpool Pod 2개 × 40 = Primary 커넥션 최대 80 (CNPG max_connections 200)
num_init_children = 40
max_pool = 1
reserved_connections = 0
connection_cache = on

# 읽기/쓰기 분리
load_balance_mode = on
# 트랜잭션에서 쓰기가 한 번 나오면 그 트랜잭션이 끝날 때까지 조회도 Primary로 보냅니다.
disable_load_balance_on_write = 'transaction'
statement_level_load_balance = off
# write_function_list와 read_only_function_list를 비워 두면 volatile 함수(nextval, pg_advisory_lock 등)를 쓰기로 봅니다.
write_function_list = ''
read_only_function_list = ''

# 복제 지연 검사: 1초를 넘긴 Standby에는 조회를 보내지 않습니다.
sr_check_period = 5
sr_check_user = 'pgpool_monitor'
sr_check_password = ''
sr_check_database = 'postgres'
delay_threshold_by_time = 1000
log_standby_delay = 'if_over_threshold'

# 장애 감지·승격은 CloudNativePG가 담당합니다.
health_check_period = 0
failover_on_backend_error = off
failover_on_backend_shutdown = off
use_watchdog = off

memory_cache_enabled = off

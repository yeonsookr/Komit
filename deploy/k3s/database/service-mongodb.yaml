apiVersion: v1
kind: ConfigMap
metadata:
  name: service-mongodb-init
  namespace: komit
  labels:
    app.kubernetes.io/name: service-mongodb
    app.kubernetes.io/part-of: komit
data:
  init-service-user.js: |
    const database = process.env.MONGODB_DATABASE || "service";
    const username = process.env.MONGODB_USERNAME;
    const password = process.env.MONGODB_PASSWORD;
    if (!username || !password) {
      throw new Error("MONGODB_USERNAME and MONGODB_PASSWORD are required");
    }
    db.getSiblingDB(database).createUser({
      user: username,
      pwd: password,
      roles: [{ role: "readWrite", db: database }],
    });
---
apiVersion: v1
kind: Service
metadata:
  name: service-mongodb
  namespace: komit
  labels:
    app.kubernetes.io/name: service-mongodb
    app.kubernetes.io/part-of: komit
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: service-mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: service-mongodb
  namespace: komit
  labels:
    app.kubernetes.io/name: service-mongodb
    app.kubernetes.io/part-of: komit
spec:
  serviceName: service-mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: service-mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-mongodb
        app.kubernetes.io/part-of: komit
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb
          image: mongo:8.0.30-noble
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: HOME
              value: /tmp
            - name: MONGO_INITDB_DATABASE
              value: service
            - name: MONGODB_DATABASE
              value: service
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: service-mongodb-auth
                  key: root-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: service-mongodb-auth
                  key: root-password
            - name: MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: service-mongodb-auth
                  key: username
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: service-mongodb-auth
                  key: password
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  mongosh --quiet --username "$MONGODB_USERNAME" --password "$MONGODB_PASSWORD"
                  --authenticationDatabase "$MONGODB_DATABASE" "$MONGODB_DATABASE"
                  --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)'
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  mongosh --quiet --username "$MONGODB_USERNAME" --password "$MONGODB_PASSWORD"
                  --authenticationDatabase "$MONGODB_DATABASE" "$MONGODB_DATABASE"
                  --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)'
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  mongosh --quiet --username "$MONGODB_USERNAME" --password "$MONGODB_PASSWORD"
                  --authenticationDatabase "$MONGODB_DATABASE" "$MONGODB_DATABASE"
                  --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)'
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: configdb
              mountPath: /data/configdb
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: configdb
          emptyDir: {}
        - name: init
          configMap:
            name: service-mongodb-init
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: service-mongodb
          app.kubernetes.io/part-of: komit
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

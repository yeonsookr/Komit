apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-db-pool
  namespace: komit
  labels:
    app.kubernetes.io/name: service-db-pool
    app.kubernetes.io/component: pgpool
    app.kubernetes.io/part-of: komit
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: service-db-pool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-db-pool
        app.kubernetes.io/component: pgpool
        app.kubernetes.io/part-of: komit
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: service-db-pool
      containers:
        - name: pgpool
          image: komit-pgpool:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGPOOL_PRIMARY_HOST
              value: service-db-rw
            - name: PGPOOL_REPLICA_HOST
              value: service-db-ro
            - name: APP_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: service-db-app
                  key: username
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: service-db-app
                  key: password
            - name: MONITOR_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: service-db-pgpool-monitor
                  key: username
            - name: MONITOR_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: service-db-pgpool-monitor
                  key: password
          readinessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/pgpool-config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: pgpool-config
        - name: tmp
          emptyDir: {}
---

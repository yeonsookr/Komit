# 호스트 nginx 컨테이너가 host.docker.internal:30080으로 프록시합니다.
# K3s를 --kube-proxy-arg=nodeport-addresses=127.0.0.1/32,172.17.0.1/32로 설치해 외부 인터페이스에는 열리지 않게 합니다.
apiVersion: v1
kind: Service
metadata:
  name: service
  namespace: komit
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080

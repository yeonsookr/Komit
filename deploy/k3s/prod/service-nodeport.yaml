# 호스트 nginx가 127.0.0.1:30080으로 프록시합니다.
# K3s를 --kube-proxy-arg=nodeport-addresses=127.0.0.1/32로 설치해 외부 인터페이스에는 열리지 않게 합니다.
# escrow는 클러스터 내부 전용이라 ClusterIP로 둡니다.
apiVersion: v1
kind: Service
metadata:
  name: service
  namespace: komit
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080

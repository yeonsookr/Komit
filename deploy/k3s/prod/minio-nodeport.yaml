# 호스트 nginx 컨테이너가 file.komit.site 요청을 172.17.0.1:30090으로 프록시합니다.
# K3s를 --kube-proxy-arg=nodeport-addresses=127.0.0.1/32,172.17.0.1/32로 설치해 외부 인터페이스에는 열리지 않게 합니다.
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: komit
spec:
  type: NodePort
  ports:
    - name: s3
      port: 9000
      targetPort: s3
      nodePort: 30090

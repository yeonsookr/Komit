# 통화 중계(TURN). 직접 연결이 안 되는 망에서 영상·소리가 지나가는 길입니다. (R-CON-19)
#
# **`hostNetwork` 를 씁니다.** NodePort 는 서버 내부 주소(127.0.0.1·172.17.0.1)에만 열려
# 있어 밖에서 닿지 않고, 중계는 자기 공인 주소를 상대에게 알려 줘야 하므로 주소를 바꾸는
# 층이 사이에 끼면 안 됩니다.
#
# 로컬에는 두지 않습니다. `deploy/local/docker-compose.yml` 의 coturn 이 그 자리입니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  namespace: komit
  labels:
    app.kubernetes.io/name: coturn
    app.kubernetes.io/part-of: komit
spec:
  # 호스트 포트를 직접 잡으므로 한 노드에 하나뿐입니다. 늘리면 두 번째가 포트를 못 잡습니다.
  replicas: 1
  strategy:
    # 같은 이유로 새 Pod 와 옛 Pod 가 겹칠 수 없습니다. 내리고 올립니다.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: coturn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coturn
        app.kubernetes.io/part-of: komit
    spec:
      hostNetwork: true
      containers:
        - name: coturn
          image: coturn/coturn:4.6
          imagePullPolicy: IfNotPresent
          # 공유 비밀을 명령줄에 싣지 않습니다. 서버의 프로세스 목록에 그대로 남습니다.
          # 설정 파일을 복사해 비밀을 덧붙인 뒤 그것으로 띄웁니다.
          command: ["/bin/sh", "-ec"]
          args:
            - |
              IP=$(getent hosts "$TURN_PUBLIC_HOST" | awk '{ print $1; exit }')
              if [ -z "$IP" ]; then
                echo "TURN_PUBLIC_HOST($TURN_PUBLIC_HOST) 의 주소를 찾지 못했습니다" >&2
                exit 1
              fi
              cp /etc/coturn/turnserver.conf /run/coturn/turnserver.conf
              # 빈 줄을 먼저 넣습니다. 위 파일이 줄바꿈 없이 끝나면 마지막 줄과 아래
              # 첫 줄이 붙어 **둘 다 조용히 버려집니다.** 공인 주소가 그렇게 사라지면
              # 후보는 생기는데 연결만 안 되는, 가장 알아보기 어려운 고장이 됩니다.
              echo >> /run/coturn/turnserver.conf
              {
                echo "external-ip=$IP"
                echo "realm=$TURN_PUBLIC_HOST"
                echo "static-auth-secret=$TURN_SHARED_SECRET"
                # **자기 자신에게는 보낼 수 있어야 합니다.** 양쪽이 모두 중계를 타면 이
                # 서버의 중계끼리 주고받는데, 그때 상대 주소가 이 노드의 내부 주소로
                # 풀립니다. 아래 denied-peer-ip 의 사설 대역에 그것이 들어 있어, 두지
                # 않으면 정작 중계가 꼭 필요한 통화만 안 붙습니다.
                echo "allowed-peer-ip=$NODE_IP"
              } >> /run/coturn/turnserver.conf
              exec turnserver -c /run/coturn/turnserver.conf
          env:
            # 자기 공인 주소를 모르면 닿을 수 없는 주소를 상대에게 알려 줍니다. 후보는
            # 생기는데 연결이 안 되는, 가장 알아보기 어려운 고장입니다.
            - name: TURN_PUBLIC_HOST
              valueFrom:
                secretKeyRef:
                  name: coturn-secret
                  key: TURN_PUBLIC_HOST
            - name: TURN_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: coturn-secret
                  key: TURN_SHARED_SECRET
            # 이 노드의 내부 주소. 중계끼리 주고받을 때 상대 주소가 이것으로 풀립니다.
            # 환경마다 달라 설정에 적지 않고 쿠버네티스에 물어봅니다.
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - name: turn-udp
              containerPort: 3478
              protocol: UDP
            - name: turn-tcp
              containerPort: 3478
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # 중계는 영상이 통째로 지나갑니다. CPU 는 거의 안 쓰고 대역폭을 씁니다.
              cpu: "500m"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # **쓰라고 주는 것이 아니라 실행하려고 주는 것입니다.** 3478 은 특권 포트가
              # 아니라 이 권한이 필요 없는데, `turnserver` 바이너리에 그것이 붙어 있어
              # 바운딩 셋에 없으면 커널이 실행 자체를 거부합니다
              # (`exec: turnserver: Operation not permitted`).
              # 빼면 Pod 가 기동하지 못합니다. 안 쓰는 권한처럼 보여도 지우지 마세요.
              add: ["NET_BIND_SERVICE"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/coturn
              readOnly: true
            - name: runtime
              mountPath: /run/coturn
      volumes:
        - name: config
          configMap:
            name: coturn-config
        - name: runtime
          emptyDir: {}

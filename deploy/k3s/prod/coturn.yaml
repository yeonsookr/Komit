# 통화 중계(TURN). 직접 연결이 안 되는 망에서 영상·소리가 지나가는 길이다. (R-CON-19)
#
# `hostNetwork` 를 쓴다. NodePort 는 서버 내부 주소에만 열려 있어 밖에서 닿지 않고,
# 중계는 자기 공인 주소를 상대에게 그대로 알려 줘야 해서 주소를 바꾸는 층이 끼면 안 된다.
#
# 로컬에는 두지 않는다. `deploy/local/docker-compose.yml` 의 coturn 이 그 자리다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  namespace: komit
  labels:
    app.kubernetes.io/name: coturn
    app.kubernetes.io/part-of: komit
spec:
  # 호스트 포트를 직접 잡으므로 하나뿐이다. 늘리면 두 번째가 포트를 못 잡는다.
  replicas: 1
  strategy:
    # 같은 이유로 새 Pod 와 옛 Pod 가 겹칠 수 없다.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: coturn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coturn
        app.kubernetes.io/part-of: komit
    spec:
      hostNetwork: true
      containers:
        - name: coturn
          image: coturn/coturn:4.6
          imagePullPolicy: IfNotPresent
          # 공유 비밀을 명령줄에 싣지 않는다. 서버의 프로세스 목록에 그대로 남는다.
          command: ["/bin/sh", "-ec"]
          args:
            - |
              IP=$(getent hosts "$TURN_PUBLIC_HOST" | awk '{ print $1; exit }')
              if [ -z "$IP" ]; then
                echo "TURN_PUBLIC_HOST($TURN_PUBLIC_HOST) 의 주소를 찾지 못했습니다" >&2
                exit 1
              fi
              cp /etc/coturn/turnserver.conf /run/coturn/turnserver.conf
              # 위 파일이 줄바꿈 없이 끝나면 마지막 줄과 아래 첫 줄이 붙어 둘 다 조용히
              # 버려진다. 그렇게 공인 주소가 사라지면 후보는 생기는데 연결만 안 된다.
              echo >> /run/coturn/turnserver.conf
              {
                echo "external-ip=$IP"
                echo "realm=$TURN_PUBLIC_HOST"
                echo "static-auth-secret=$TURN_SHARED_SECRET"
                # 자기 자신에게는 보낼 수 있어야 한다. 양쪽이 모두 중계를 타면 이 서버의
                # 중계끼리 주고받는데, 그 주소가 turnserver.conf 의 사설 대역에 들어 있다.
                # 빼면 정작 중계가 꼭 필요한 통화만 안 붙는다.
                echo "allowed-peer-ip=$NODE_IP"
              } >> /run/coturn/turnserver.conf
              exec turnserver -c /run/coturn/turnserver.conf
          env:
            - name: TURN_PUBLIC_HOST
              valueFrom:
                secretKeyRef:
                  name: coturn-secret
                  key: TURN_PUBLIC_HOST
            - name: TURN_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: coturn-secret
                  key: TURN_SHARED_SECRET
            # 환경마다 달라 설정에 적지 않고 쿠버네티스에 물어본다.
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - name: turn-udp
              containerPort: 3478
              protocol: UDP
            - name: turn-tcp
              containerPort: 3478
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # 중계는 CPU 가 아니라 대역폭을 쓴다.
              cpu: "500m"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # 쓰려는 것이 아니라 실행하려는 것이다. 3478 은 특권 포트가 아니라 이 권한이
              # 필요 없는데, `turnserver` 바이너리에 붙어 있어 바운딩 셋에 없으면 커널이
              # 실행을 거부한다 (`exec: turnserver: Operation not permitted`).
              # 안 쓰는 권한처럼 보여도 빼면 Pod 가 기동하지 못한다.
              add: ["NET_BIND_SERVICE"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/coturn
              readOnly: true
            - name: runtime
              mountPath: /run/coturn
      volumes:
        - name: config
          configMap:
            name: coturn-config
        - name: runtime
          emptyDir: {}

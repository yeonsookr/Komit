listening-port=3478

# 중계기가 상대에게 보낼 때 쓰는 포트. 클라이언트가 붙는 3478 과 다르다.
# 방화벽은 이 범위도 UDP 로 열어야 한다.
#
# 실질 상한은 아래 quota 가 아니라 이 범위다. 한 통화가 네 포트쯤 쓴다.
min-port=49160
max-port=49200

# 계정을 미리 만들지 않는다. 서버가 공유 비밀로 만든 자격을 같은 계산으로 맞춰 본다.
use-auth-secret

user-quota=12
total-quota=100

# 자격을 가진 사람이 중계기로 내부망에 닿지 못하게 한다. 빠지면 침투 통로가 된다.
#
# 노드 자신의 주소만 예외다. 양쪽이 모두 중계를 타면 이 서버의 중계끼리 주고받아야
# 하는데 그 주소가 아래 사설 대역에 들어 있다. 예외는 `coturn.yaml` 이 기동할 때 붙인다.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=224.0.0.0-255.255.255.255

no-cli

# TLS 는 쓸 망에서 3478 이 정말 막히는 것을 확인한 뒤에 켠다. 인증서를 nginx 가 쥐고
# 있어 갱신까지 함께 다뤄야 한다. (계획 3.2, 단계 0)
no-tls
no-dtls

# 상대에게 TCP 로 내보내는 길(RFC 6062)을 닫는다. 브라우저는 쓰지 않는다 —
# `transport=tcp` 는 나와 중계 서버 사이만 TCP 라는 뜻이다.
#
# 열어 두면 위에서 예외로 둔 노드 주소로 TCP 접속이 되고, 거기 붙은 k3s API 와 DB·Redis
# 포트가 사정권에 든다. ufw 는 그것을 막지 못한다 — 자기 주소로 가는 것은 lo 를 타서
# 그냥 통과한다.
no-tcp-relay

fingerprint

# 호스트 nginx 컨테이너가 172.17.0.1:30083으로 프록시합니다.
apiVersion: v1
kind: Service
metadata:
  name: fe-be
  namespace: komit
  labels:
    app.kubernetes.io/name: fe-be
    app.kubernetes.io/part-of: komit
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fe-be
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30083

# 예시 파일입니다. 실제 비밀번호를 채운 파일은 Git에 커밋하지 마세요.
# deploy.sh는 환경변수로 같은 Secret을 만듭니다. 수동으로 적용할 때만 이 형식을 참고합니다.
apiVersion: v1
kind: Secret
metadata:
  name: service-db-app
  namespace: komit
type: kubernetes.io/basic-auth
stringData:
  username: service
  password: change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: escrow-db-app
  namespace: komit
type: kubernetes.io/basic-auth
stringData:
  username: escrow
  password: change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: service-storage
  namespace: komit
type: Opaque
stringData:
  STORAGE_ACCESS_KEY: change-me
  STORAGE_SECRET_KEY: change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: service-mongodb-auth
  namespace: komit
type: Opaque
stringData:
  root-username: root
  root-password: change-me
  username: service
  password: change-me
